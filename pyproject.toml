[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zalo-order-crawler"
version = "0.1.0"
description = "Crawl tin nhan Zalo Web theo ngay va phan loai don hang bang Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-genai>=1.0,<2",
  "pillow>=11,<13",
  "playwright>=1.50,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]

[project.scripts]
zalo-order-crawler = "zalo_order_crawler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zalo_order_crawler = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
